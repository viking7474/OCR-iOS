name: Build iOS 13

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build Tesseract iOS 13
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config

      - name: Clean All
        run: |
          cd TesseractOCR
          make clean-all

      - name: Build Tesseract
        run: |
          cd TesseractOCR
          make build

      - name: Build XCFrameworks
        run: |
          cd TesseractOCR
          make xcframeworks

      - name: Verify MinOS is 13.0
        run: |
          otool -l TesseractOCR/xcframework/Tesseract.xcframework/ios-arm64/libtesseract.a | grep -A4 LC_BUILD_VERSION

      - name: Verify no archive symbols
        run: |
          ! nm -u TesseractOCR/xcframework/Tesseract.xcframework/ios-arm64/libtesseract.a | grep archive
